version: 2

goal:
  title: "Game Overhaul 2026"
  slug: "game-overhaul-2026"
  kind: open_ended
  tranche: "Research, baseline save, production safety, visual shell overhaul, performance telemetry/cache integration, and production-readiness polish."
  status: complete

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: PM
    status: done
    objective: "Map repo purpose, architecture, verification commands, health signals, and improvement candidates."
    inputs:
      - README.md
      - package.json
      - next.config.js
      - app/page.tsx
      - app/game
      - app/components
      - app/theme
      - OPTIMIZATION_TODO.md
      - "Official web, React, and Next.js documentation."
    constraints:
      - "Read-only."
      - "Prefer concrete file-path evidence over generic advice."
      - "Use primary technical sources."
    expected_output:
      - "Repo map."
      - "Verification commands."
      - "Ranked improvement candidates."
      - "Candidate next tasks."
    receipt:
      result: done
      summary: "Repo is a Next 15 / React 18 custom Canvas platformer. Core runtime is concentrated in app/page.tsx, with split modules for maps, AI, particles, caching, culling, multiplayer lobby, Ably helpers, theme tokens, and upload/API routes. Build passes, but production build skips type/lint validation and reports a Next viewport metadata warning; direct TypeScript check fails with existing errors in Button and AI state typing."
      evidence:
        - "package.json: Next 15.3.2, React 18.2, custom scripts."
        - "app/page.tsx: 12964 lines; owns canvas loop, animation loading, rendering, HUD, debug UI, controls, multiplayer hooks."
        - "app/game/platformCache.ts: cache manager exists but integration is incomplete."
        - "app/game/viewportCulling.ts: culling utilities exist."
        - "OPTIMIZATION_TODO.md: explicitly marks platform caching integration as pending."
        - "npm.cmd run build: pass with viewport metadata warning."
        - "npx.cmd tsc --noEmit: fail with 14 type errors."
        - "docs/goals/game-overhaul-2026/notes/T001-repo-and-research-scout.md"
  - id: T002
    type: judge
    assignee: PM
    status: done
    objective: "Choose the first safe implementation tranche by impact, confidence, reversibility, and verification strength."
    inputs:
      - "T001 receipt."
      - "Baseline build and type-check outputs."
    constraints:
      - "Do not begin risky visual rewrites before the production safety gate is credible."
      - "Keep the deployed setup intact."
    expected_output:
      - "Decision."
      - "First Worker task."
      - "Blocked or deferred tasks."
    receipt:
      result: done
      decision: "Do production safety first: fix the Next viewport warning and direct TypeScript failures so later visual/performance work has a meaningful local gate. Then commit and push. Defer major HUD, menu, map, and platform-cache refactors until the safety gate is green."
      next_allowed_task: T003
      blocked_tasks:
        - "T004"
        - "T005"
  - id: T003
    type: worker
    assignee: PM
    status: done
    objective: "Fix the first production-safety gate: Next viewport metadata warning and direct TypeScript failures."
    allowed_files:
      - "app/layout.tsx"
      - "app/components/ui/Button.tsx"
      - "app/game/ai/stateMachine.ts"
      - "docs/goals/game-overhaul-2026/state.yaml"
    verify:
      - "npm.cmd run build"
      - "npx.cmd tsc --noEmit"
      - "git status --short --branch"
    stop_if:
      - "Need deployment credentials."
      - "A fix requires changing gameplay behavior beyond type preservation."
      - "Verification fails twice for unrelated reasons."
    receipt:
      result: done
      changed_files:
        - "app/layout.tsx"
        - "app/components/ui/Button.tsx"
        - "app/game/ai/stateMachine.ts"
      commands:
        - cmd: "npx.cmd tsc --noEmit"
          status: pass
          summary: "Direct TypeScript check now passes."
        - cmd: "npm.cmd run build"
          status: pass
          summary: "Production build passes and the previous viewport metadata warning is gone."
      summary: "Moved viewport config to the supported Next.js `viewport` export, made UI Button DOM style restoration string-safe, and narrowed AI move directions only at decision boundaries to preserve existing Character aiData compatibility."
  - id: T004
    type: worker
    assignee: PM
    status: done
    objective: "Overhaul the visible shell: menu, HUD, pause/debug overlays, typography, broken mojibake strings, responsive containment, and visual hierarchy."
    allowed_files:
      - "app/page.tsx"
      - "app/theme/css-vars.css"
      - "app/theme/tokens.ts"
      - "app/components/ui/Button.tsx"
      - "app/components/ui/Dialog.tsx"
      - "app/components/ui/Panel.tsx"
      - "app/components/ui/PromptDialog.tsx"
      - "app/components/multiplayer/MapSelectionScreen.tsx"
      - "app/components/multiplayer/ReadyUpScreen.tsx"
      - "app/components/multiplayer/LobbyView.tsx"
      - "app/components/multiplayer/LobbyMenu.tsx"
    verify:
      - "npm.cmd run build"
      - "npx.cmd tsc --noEmit"
      - "Browser screenshot/playtest of menu and in-game HUD at desktop and mobile widths."
    stop_if:
      - "Visual changes require new external assets."
      - "Multiplayer lobby flow becomes ambiguous."
      - "HUD overlaps the playfield in verification."
    receipt:
      result: done
      changed_files:
        - "app/page.tsx"
        - "app/theme/css-vars.css"
      commands:
        - cmd: "npx.cmd tsc --noEmit"
          status: pass
          summary: "Direct TypeScript check passes after the UI changes."
        - cmd: "npm.cmd run build"
          status: pass
          summary: "Production build passes after the UI changes."
        - cmd: "Browser desktop and mobile menu screenshots on http://localhost:3002"
          status: pass
          summary: "Menu title, layout, and controls render correctly at 1365x768 and 390x844 after moving CSS to global stylesheet."
        - cmd: "Browser in-game HUD screenshot on http://localhost:3002"
          status: mixed
          summary: "Top combat HUD is clearer and bottom action HUD is smaller. Existing animation loader 404s remain visible in console and are assigned to T005."
      summary: "Reworked the first-screen shell with a correct DOM title, stronger backdrop, responsive menu grid, shared global UI classes, cleaner button labels, corrected Mayhem metadata/footer text, and smaller persistent combat HUD constants."
  - id: T005
    type: worker
    assignee: PM
    status: done
    objective: "Integrate the platform caching/frame telemetry path and remove animation-loader 404 probing without changing gameplay rules."
    allowed_files:
      - "app/page.tsx"
      - "app/game/platformCache.ts"
      - "app/game/viewportCulling.ts"
      - "app/game/maps/suburbia.ts"
      - "app/game/maps/metropolis.ts"
      - "app/game/maps/rooftops.ts"
    verify:
      - "npm.cmd run build"
      - "npx.cmd tsc --noEmit"
      - "Browser playtest with frame/HUD inspection and no console runtime errors."
    stop_if:
      - "Caching changes alter collision, platform placement, or map boundaries."
      - "Offscreen/bitmap fallback breaks a supported browser path."
    receipt:
      result: done
      changed_files:
        - "app/page.tsx"
        - "app/game/platformCache.ts"
      commands:
        - cmd: "npx.cmd tsc --noEmit"
          status: pass
          summary: "Direct TypeScript check passes after deterministic animation loading and telemetry changes."
        - cmd: "npm.cmd run build"
          status: pass
          summary: "Production build passes after the performance slice."
        - cmd: "Browser playtest on http://localhost:3003"
          status: pass
          summary: "Loaded Suburbia match with a bot. Animation phase 1 loaded 135/135 critical frames, phase 2 loaded 431 background frames in 1.9s total, and there were no console warnings or errors after game start."
        - cmd: "window.__platformerFrameTelemetry inspection"
          status: pass
          summary: "Telemetry exposed frame/update/render timing, visible platform count, and platform cache stats; Suburbia run showed about 60 FPS, 6 visible platforms, cache size 9, 4184 hits, 9 misses, and 0.997 hit rate."
      summary: "Replaced speculative animation URL probing with deterministic per-animation frame URLs, stabilized platform cache keys for moving platforms, cleared cached platform art on map/reset changes, and exposed lightweight frame telemetry for browser performance inspection."
  - id: T006
    type: pm
    assignee: PM
    status: done
    objective: "Run a completion audit against the prompt and current tranche evidence before marking any goal complete."
    inputs:
      - "All receipts."
      - "Build/type/playtest outputs."
      - "Git commit and push state."
    constraints:
      - "Treat uncertainty as incomplete."
    expected_output:
      - "Prompt-to-artifact checklist."
      - "Evidence for each explicit requirement."
      - "Missing or deferred requirements."
    receipt:
      result: incomplete
      summary: "The current tranche has credible evidence for research, baseline save, incremental commits, production safety fixes, visual shell polish, deterministic animation loading, platform cache telemetry, green type/build checks, browser playtest, and pushed commits. The full goal should remain active because `next build` still skips TypeScript validation, the app still lacks an explicit favicon route, and default lobby/voice diagnostics are too noisy for production readiness."
      evidence:
        - "git log --oneline -5: baseline, docs, safety, visual, and performance commits are present and pushed."
        - "git status --short --branch: clean and aligned with origin/main after T005 push."
        - "T005 browser receipt: no post-start console warnings/errors and telemetry/cache stats are exposed."
      next_allowed_task: T007
  - id: T007
    type: worker
    assignee: PM
    status: done
    objective: "Finish production-readiness polish by making builds validate TypeScript, adding a favicon route, and gating noisy lobby/voice debug logs."
    allowed_files:
      - "next.config.js"
      - "app/icon.svg"
      - "app/context/GameContext.tsx"
      - "app/components/voice/VoiceChat.tsx"
      - "docs/goals/game-overhaul-2026/state.yaml"
    verify:
      - "npx.cmd tsc --noEmit"
      - "npm.cmd run build"
      - "Browser reload on a fresh dev server with no favicon 404 and reduced default console noise."
    stop_if:
      - "Next build validation fails for errors outside the edited scope."
      - "Favicon handling requires binary asset tooling."
      - "Debug-log gating hides warnings or errors needed for real failures."
    receipt:
      result: done
      changed_files:
        - "next.config.js"
        - "app/icon.svg"
        - "app/context/GameContext.tsx"
        - "app/components/voice/VoiceChat.tsx"
      commands:
        - cmd: "npx.cmd tsc --noEmit"
          status: pass
          summary: "Direct TypeScript check passes after build-config and log-gating changes."
        - cmd: "npm.cmd run build"
          status: pass
          summary: "Next build now runs 'Linting and checking validity of types' and passes; the previous explicit skip flags are gone."
        - cmd: "Browser reload on http://localhost:3004"
          status: pass
          summary: "Fresh load reports zero warnings/errors, injects /icon.svg as the favicon, and suppresses routine lobby/voice debug logs unless platformerDebugLogs is set."
      summary: "Made production builds validate TypeScript, added a Next app favicon route, and moved routine lobby/voice diagnostics behind an opt-in localStorage debug flag while leaving warnings and errors visible."
  - id: T008
    type: pm
    assignee: PM
    status: done
    objective: "Run the final completion audit after production-readiness polish and decide whether the goal can be marked complete."
    inputs:
      - "All task receipts."
      - "Latest build/type/browser evidence."
      - "Latest git push state."
    constraints:
      - "Do not mark the goal complete if deployment, core gameplay, visual, performance, or setup evidence is missing."
    expected_output:
      - "Final prompt-to-artifact checklist."
      - "Residual risks."
      - "Completion decision."
    receipt:
      result: complete
      decision: "Mark the goal complete."
      checklist:
        - requirement: "Save a baseline before overhaul work."
          status: pass
          evidence: "Empty baseline commit 3642c4b was pushed before implementation changes."
        - requirement: "Use a researched high-level plan."
          status: pass
          evidence: "T001 research note cites official MDN, web.dev, React, Next.js, and Chrome DevTools sources and maps repo-specific candidates."
        - requirement: "Keep the existing Next.js setup easy to build and deploy."
          status: pass
          evidence: "next.config.js no longer skips validation; npm.cmd run build passes with type validity checking and existing routes intact."
        - requirement: "Improve visual polish and game shell readiness."
          status: pass
          evidence: "T004 reworked the menu, title, HUD hierarchy, responsive shell, and broken visible labels; browser desktop/mobile checks passed."
        - requirement: "Improve performance and game readiness."
          status: pass
          evidence: "T005 removed speculative animation 404 probing, loaded all 566 animation frames deterministically, exposed frame telemetry, and showed a Suburbia platform cache hit rate near 0.998 during playtest."
        - requirement: "Commit and push along the way."
          status: pass
          evidence: "Pushed commits 3642c4b, 1a32bc3, 1ba9451, d01441e, 956fb48, and c4e694a to origin/main."
        - requirement: "Final browser/setup sanity."
          status: pass
          evidence: "Fresh http://localhost:3004 reload had zero warnings/errors, injected /icon.svg, and kept routine lobby/voice debug logs quiet by default."
      residual_risks:
        - "Live deployment status was not independently verified because no deployment provider credentials or dashboard access were used; origin/main has been pushed for the existing deployment path."
        - "The main runtime remains concentrated in app/page.tsx, so future large features should be split carefully behind additional playtests."
      summary: "The requested overhaul is handled within the current repo and deployment workflow: researched plan, baseline, incremental pushed commits, stronger production checks, more polished UI shell, deterministic asset loading, platform cache telemetry, and clean local browser verification."

checks:
  dirty_fingerprint: "baseline clean before docs; empty baseline commit 3642c4b pushed to origin/main."
  last_verification:
    result: pass
    task: T008
    commands:
      - cmd: "npm.cmd run build"
        status: pass
        summary: "Compiled, linted, and checked type validity after removing skipped validation flags."
      - cmd: "npx.cmd tsc --noEmit"
        status: pass
        summary: "Direct TypeScript check passes."
      - cmd: "Browser playtest"
        status: pass
        summary: "Fresh browser reload on http://localhost:3004 has no warnings/errors, includes the icon route, and keeps routine lobby/voice logs quiet by default."
      - cmd: "git status --short --branch"
        status: pass
        summary: "main is clean and aligned with origin/main after c4e694a push."
